<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Vorlage für die Store-Bilder. Aufruf: screens.html#<lang>-<motiv>
     lang: en | de     motiv: feed | settings | promo
     Gerendert mit Firefox headless (siehe build.sh). Zeitungen und Schlagzeilen sind erfunden. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; font-family: "Inter", system-ui, sans-serif; }
  body { background: linear-gradient(135deg, #eef0ff 0%, #f7f2ff 100%); color: #1f2328; }
  .caption { height: 150px; display: flex; flex-direction: column; justify-content: center; padding: 0 72px; }
  .caption h1 { font-size: 40px; letter-spacing: -0.5px; }
  .caption h1 em { font-style: normal; color: #4f46e5; }
  .caption p { font-size: 20px; color: #59636e; margin-top: 6px; }
  .window { position: absolute; left: 72px; right: 72px; top: 160px; bottom: -20px; background: #fff; border-radius: 14px 14px 0 0; box-shadow: 0 20px 60px rgba(60, 50, 140, .18); overflow: hidden; }
  .chrome { height: 44px; background: #f1f3f4; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #e0e0e0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; } .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .url { margin-left: 16px; flex: 1; height: 28px; border-radius: 14px; background: #fff; display: flex; align-items: center; padding: 0 14px; font-size: 14px; color: #5f6368; }
  .ext { width: 24px; height: 24px; }
  .feed { padding: 24px 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; }
  .card { display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid #e8eaed; transition: none; }
  .card.dim { opacity: .4; }
  .thumb { width: 112px; height: 84px; border-radius: 10px; flex: none; }
  .src { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #3c4043; }
  .fav { width: 16px; height: 16px; border-radius: 4px; color: #fff; font-size: 10px; display: grid; place-items: center; font-weight: 700; }
  .title { font-size: 18px; line-height: 1.35; margin-top: 4px; font-weight: 500; color: #202124; }
  .time { font-size: 12px; color: #70757a; margin-top: 6px; }
  /* Tags wie in src/content.css (heller Modus) */
  .pwm-badge { display: inline-block; margin: 6px 0 0; padding: 1px 8px; border-radius: 999px; font: 600 12px/18px system-ui, sans-serif; border: 1px solid transparent; }
  .pwm-badge[data-s="paywall"] { background: #fce8e6; color: #a50e0e; }
  .pwm-badge[data-s="metered"] { background: #fef7e0; color: #8a5a00; }
  .pwm-badge[data-s="free"] { background: #e6f4ea; color: #137333; }
  .pwm-badge[data-s="likelyFree"] { background: #f3faf5; color: #137333; border: 1px dashed #81c995; }
  .pwm-badge[data-s="unknown"] { background: #f3e8fd; color: #681da8; }
  .tip { position: absolute; background: #3c4043; color: #fff; font-size: 13px; line-height: 1.45; padding: 8px 12px; border-radius: 6px; max-width: 360px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .tip small { color: #bdc1c6; }
  /* Einstellungen */
  .settings { display: flex; gap: 32px; padding: 0 24px 0 48px; }
  .sidecol { width: 300px; flex: none; display: flex; flex-direction: column; gap: 28px; padding-top: 56px; }
  /* Auf 85 % verkleinert, damit die ganze Seite inkl. Buttons ins Bild passt */
  .settings iframe { flex: none; width: 861px; height: 700px; border: 0; border-left: 1px solid #e8eaed; transform: scale(.85); transform-origin: top left; margin-right: -129px; }
  .side { font-size: 16px; color: #3c4043; line-height: 1.45; padding-left: 14px; border-left: 3px solid #c7d2fe; }
  .side b { color: #4f46e5; display: block; font-size: 18px; margin-bottom: 4px; }
  /* Werbebild 440x280 */
  body.promo { width: 440px; height: 280px; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; }
  .promo-box { padding: 30px 32px; }
  .promo-head { display: flex; align-items: center; gap: 14px; }
  .promo-head img { width: 64px; height: 64px; }
  .promo-head h1 { font-size: 30px; letter-spacing: -0.5px; }
  .promo-box p { font-size: 18px; margin: 16px 0 18px; line-height: 1.35; opacity: .95; }
  .promo-box .pwm-badge { margin: 0 6px 6px 0; font-size: 13px; }
</style>
</head>
<body>
<script>
const [lang, shot] = (location.hash.slice(1) || "en-feed").split("-");
const T = {
  en: {
    cap: "Know <em>before</em> you click", sub: "Paywalled articles are marked right in your news feed.",
    url: "news.google.com/home", lbl: { paywall: "🔒 Paywall", metered: "⏳ Metered", free: "✓ free", likelyFree: "✓? free", unknown: "? unclear" },
    tip: "<b>Paid content</b> – Publisher marks it as paid<br><small>(isAccessibleForFree: false)</small>",
    items: [
      ["paywall", "The Daily Ledger", "#b91c1c", "Inside the race to build cheaper batteries for city buses", "2 hours ago"],
      ["free", "Morning Courier", "#0e7490", "Storm warning lifted as coastal towns begin cleanup", "35 minutes ago"],
      ["likelyFree", "Tech Pulse", "#7c3aed", "Five settings worth changing on your new phone", "1 hour ago"],
      ["metered", "Harbor Times", "#b45309", "Port expansion vote delayed again after late objections", "3 hours ago"],
      ["free", "Civic Report", "#15803d", "City council approves new bike lanes for the old town", "4 hours ago"],
      ["paywall", "Market Brief", "#1d4ed8", "Why mid-sized firms are quietly raising wages", "5 hours ago"],
      ["unknown", "Northern Gazette", "#475569", "Museum reopens after two-year renovation", "6 hours ago"],
      ["free", "Science Daily Wire", "#be185d", "Volunteers count record number of migrating cranes", "6 hours ago"],
    ],
    s_cap: "Your rules, <em>your language</em>", s_sub: "Dim or hide paywalled articles, add fallback rules, choose from 16 languages.",
    side: [["Dim or hide", "Paywalled articles fade out or disappear."], ["Fallback lists", "For sites that block automated checks."], ["16 languages", "Browser language by default."]],
    promo: "Know before you click: paywalled articles marked in your news feed.",
  },
  de: {
    cap: "Wissen, <em>bevor</em> du klickst", sub: "Paywall-Artikel werden direkt im News-Feed markiert.",
    url: "news.google.com/home", lbl: { paywall: "🔒 Paywall", metered: "⏳ Zähler", free: "✓ frei", likelyFree: "✓? frei", unknown: "? unklar" },
    tip: "<b>Kostenpflichtig</b> – Verlag kennzeichnet als kostenpflichtig<br><small>(isAccessibleForFree: false)</small>",
    items: [
      ["paywall", "Tagesbote", "#b91c1c", "Wie Stadtwerke günstigere Akkus für Busse entwickeln wollen", "vor 2 Stunden"],
      ["free", "Morgenkurier", "#0e7490", "Sturmwarnung aufgehoben – Küstenorte beginnen mit Aufräumen", "vor 35 Minuten"],
      ["likelyFree", "Technik-Puls", "#7c3aed", "Fünf Einstellungen, die du am neuen Handy ändern solltest", "vor 1 Stunde"],
      ["metered", "Hafenblatt", "#b45309", "Abstimmung über Hafenausbau erneut verschoben", "vor 3 Stunden"],
      ["free", "Bürgerreport", "#15803d", "Stadtrat beschließt neue Radwege für die Altstadt", "vor 4 Stunden"],
      ["paywall", "Marktbrief", "#1d4ed8", "Warum Mittelständler still und leise die Löhne erhöhen", "vor 5 Stunden"],
      ["unknown", "Nordanzeiger", "#475569", "Museum öffnet nach zwei Jahren Umbau wieder", "vor 6 Stunden"],
      ["free", "Wissen kompakt", "#be185d", "Freiwillige zählen Rekordzahl an Zugvögeln", "vor 6 Stunden"],
    ],
    s_cap: "Deine Regeln, <em>deine Sprache</em>", s_sub: "Paywall-Artikel abblenden oder ausblenden, eigene Regeln, 16 Sprachen.",
    side: [["Abblenden oder ausblenden", "Paywall-Artikel treten zurück oder verschwinden."], ["Fallback-Listen", "Für Seiten, die die Prüfung blocken."], ["16 Sprachen", "Standard ist die Browsersprache."]],
    promo: "Wissen, bevor du klickst: Paywall-Artikel im News-Feed markiert.",
  },
}[lang];
const grad = ["#c7d2fe,#a5b4fc", "#bae6fd,#7dd3fc", "#ddd6fe,#c4b5fd", "#fde68a,#fcd34d", "#bbf7d0,#86efac", "#bfdbfe,#93c5fd", "#e2e8f0,#cbd5e1", "#fbcfe8,#f9a8d4"];

if (shot === "promo") {
  document.body.className = "promo";
  document.body.insertAdjacentHTML("beforeend", `<div class="promo-box">
    <div class="promo-head"><img src="../icons/icon-128.png" alt=""><h1>Paywall-Marker</h1></div>
    <p>${T.promo}</p>
    <span class="pwm-badge" data-s="paywall">${T.lbl.paywall}</span><span class="pwm-badge" data-s="free">${T.lbl.free}</span><span class="pwm-badge" data-s="metered">${T.lbl.metered}</span>
  </div>`);
} else {
  const isFeed = shot === "feed";
  document.body.insertAdjacentHTML("beforeend", `
    <div class="caption"><h1>${isFeed ? T.cap : T.s_cap}</h1><p>${isFeed ? T.sub : T.s_sub}</p></div>
    <div class="window">
      <div class="chrome"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <div class="url">${isFeed ? T.url : "chrome-extension://…/options/options.html"}</div><img class="ext" src="../icons/icon-48.png" alt=""></div>
      <div id="content"></div>
    </div>`);
  const c = document.getElementById("content");
  if (isFeed) {
    c.className = "feed";
    c.innerHTML = T.items.map(([s, src, col, title, time], i) => `
      <div class="card ${s === "paywall" ? "dim" : ""}">
        <div class="thumb" style="background:linear-gradient(135deg,${grad[i]})"></div>
        <div><div class="src"><span class="fav" style="background:${col}">${src[0]}</span>${src}</div>
          <span class="pwm-badge" data-s="${s}" ${i === 0 ? 'id="b0"' : ""}>${T.lbl[s]}</span>
          <div class="title">${title}</div><div class="time">${time}</div></div>
      </div>`).join("");
    // Erste Paywall-Karte "gehovert": volle Deckkraft + Tooltip
    const first = c.querySelector(".card");
    first.classList.remove("dim");
    requestAnimationFrame(() => {
      const b = document.getElementById("b0").getBoundingClientRect(), w = document.querySelector(".window").getBoundingClientRect();
      document.querySelector(".window").insertAdjacentHTML("beforeend", `<div class="tip" style="left:${b.left - w.left + 20}px;top:${b.bottom - w.top + 8}px">${T.tip}</div>`);
    });
  } else {
    c.className = "settings";
    c.innerHTML = `<div class="sidecol">${T.side.map(([h, p]) => `<div class="side"><b>${h}</b>${p}</div>`).join("")}</div>
      <iframe src="../dist/preview_options_${lang}.html"></iframe>`;
  }
}
</script>
</body>
</html>
